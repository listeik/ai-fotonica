name: Verify synthesis and dashboard
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -e './backend[dev]'
      - run: ruff check backend
      - run: python -m pytest backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  render-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/render.Dockerfile
          load: true
          tags: ai-fotonica:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check frontend, model readiness and neural synthesis
        run: |
          docker run --detach --name ai-fotonica-ci --memory=512m --publish 127.0.0.1:10000:10000 ai-fotonica:ci
          python backend/scripts/smoke_deployment.py --url http://127.0.0.1:10000 --timeout 120
      - name: Container logs
        if: always()
        run: docker logs ai-fotonica-ci || true
