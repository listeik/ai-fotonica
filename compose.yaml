services:
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      DOE_DEVICE: cpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json;
          from urllib.request import urlopen;
          model = json.load(urlopen('http://127.0.0.1:8000/api/model/info', timeout=2));
          raise SystemExit(0 if model['available'] else 1)
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${DOE_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
