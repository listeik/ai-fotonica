services:
  backend:
    build:
      context: .
      dockerfile: infra/render.Dockerfile
    ports:
      - "127.0.0.1:${DOE_WEB_PORT:-5173}:10000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:10000/api/ready', timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 5
