services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    environment:
      DOE_DEVICE: cpu
      DOE_CHECKPOINT: /models/doe-unet.pt
    volumes:
      - ../artifacts:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
      additional_contexts:
        proxy: .
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
